name: Tests

on:
  push:
    paths-ignore:
      - 'state.json'
      - '**.md'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # Verifie que sites.yaml est valide avant qu'un cron ne parte en erreur.
      - name: Valider sites.yaml
        run: node -e "import('./src/config.js').then(m => { const c = m.loadConfig('sites.yaml'); console.log(c.sites.length + ' site(s) actif(s)'); })"
