  # ---------------------------------------------------------------------------
  # VEILLES CATÉGORIE — articles dont la fiche a été retirée du catalogue
  #
  # Une fiche supprimée ne revient pas forcément à la même adresse : surveiller
  # son ancienne URL ne servirait à rien. On surveille donc la page catégorie du
  # marchand, qui ne disparaît pas, en y cherchant le nom exact du coffret.
  # Dès qu'il est remis en ligne, le nom apparaît et l'alerte part.
  #
  # Validé le 2026-09-21 dans les deux sens : des produits réellement listés
  # dans ces mêmes catégories répondent bien EN STOCK avec le même mécanisme.
  #
  # Les phrases sont volontairement longues. Le rapprochement se fait sur une
  # suite de mots, donc "boosters amphinobi ex pokemon 30e" ne matche pas
  # "Coffret Collection Premium Méga-Amphinobi ex", qui est un autre article.
  #
  # Deux limites : l'alerte signale une remise en ligne, pas une disponibilité —
  # il faudra cliquer pour vérifier. Et chez Philibert, qui compte 138 produits,
  # un article ne serait vu que s'il apparaît en première page ; la catégorie est
  # triée par nouveautés, ce qui joue en notre faveur. La Grande Récré n'a que
  # 31 produits, donc aucun risque de ce côté.
  # ---------------------------------------------------------------------------

  - name: "VEILLE La Grande Récré — ETB 30 ans"
    url: "https://www.lagranderecre.fr/cartes-a-collectionner/"
    identity: "cartes a collectionner"
    mode: browser
    wait_ms: 7000
    in_stock_when:
      present: ["dresseur d'elite pokemon 30e"]

  - name: "VEILLE La Grande Récré — Coffret Poster"
