    in_stock_when:
      present: ["Ajouter au panier"]
      absent: ["Prévenez-moi lorsque le produit est disponible"]

  # Détection par schema.org, comme les 4 articles JouéClub.
  - name: "TÉMOIN JouéClub"
    url: "https://www.joueclub.fr/pokemon/-pokemon-pokebox-mega-clair-de-lune-ectoplasma-0196214139121.html"
    identity: "196214139121"
