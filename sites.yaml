#   · Coffret 4 boosters Nymphali-ex         EAN 196214147102
#   · Coffret 4 boosters Amphinobi-ex        EAN 196214147164
#
# État relevé le 2026-09-18 : tout en rupture chez tous les revendeurs.
# Chaque lien a été testé en conditions réelles, et vérifié comme pointant bien
# sur le bon EAN. URL nettoyées de leurs paramètres de tracking (aecid, ae,
# idOffre), sans effet sur la page servie.
# ---------------------------------------------------------------------------

settings:
  concurrency: 4
  heartbeat_hours: 24     # message "je suis vivant" toutes les 24h (0 = désactivé)
  error_alert_after: 3    # alerte après N échecs consécutifs sur un site
  error_repeat_hours: 12  # puis rappel toutes les N heures tant que ça dure
  timeout_ms: 30000
  retries: 2

sites:
  # ⚠️ KING JOUET — SURVEILLANCE PEU FIABLE (constaté le 2026-09-21)
  #
  # Le site est protégé par DataDome, comme la Fnac. Ses 4 fiches Pokémon ne
  # passent que parce qu'elles sont populaires et servies par le cache
  # Cloudflare (cf-cache-status: HIT) : la requête n'atteint jamais le serveur
  # protégé. Une fiche hors cache renvoie 403 (vérifié sur un autre produit).
  #
  # Conséquence : on lit une copie qui avait ~3 h 30 au moment du constat, et
  # que le CDN est autorisé à servir 30 jours (s-maxage=2592000). Un réappro
  # peut donc être vu en retard, ou pas du tout. Et si le marchand purge le
  # cache au moment du réappro, la requête tombe sur DataDome : 403, donc un
  # « échec » au lieu d'une alerte de stock.
  #
  # Aucun correctif propre : forcer le passage par le serveur d'origine mène à
  # DataDome, et le contourner est exclu. Pas de témoin possible non plus, un
  # témoin en cache ne prouvant rien sur la fraîcheur des données.
  #
  # Conservé comme signal d'appoint : active en parallèle le bouton « Alerte
  # disponibilité » de King Jouet sur chaque fiche.
  - name: "King Jouet — ETB 30 ans"
    url: "https://www.king-jouet.com/jeu-jouet/jeux-societes/cartes-a-collectionner/ref-1034916-pokemon-30-ans-coffret-dresseur-d-elite.htm"
    identity: "coffret dresseur d'elite"
    mode: http

