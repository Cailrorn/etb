# ---------------------------------------------------------------------------
# Pokémon — Coffret Dresseur d'Élite 30e anniversaire (EAN 196214144835)
#
# État relevé le 2026-09-17 : en rupture sur les trois sites surveillés.
# Chaque site ci-dessous a été testé en conditions réelles.
# ---------------------------------------------------------------------------

settings:
  concurrency: 3
  heartbeat_hours: 24     # message "je suis vivant" toutes les 24h (0 = désactivé)
  error_alert_after: 3    # alerte après N échecs consécutifs sur un site
  timeout_ms: 30000
  retries: 2

sites:
  # Testé OK : schema.org expose OutOfStock, aucune protection anti-bot.
  - name: "King Jouet — ETB 30 ans"
    url: "https://www.king-jouet.com/jeu-jouet/jeux-societes/cartes-a-collectionner/ref-1034916-pokemon-30-ans-coffret-dresseur-d-elite.htm"
    mode: http

  # Testé OK : schema.org expose OutOfStock.
  # Attention, la page affiche "Ajouter au panier" même en rupture : les données
  # structurées font foi, ne pas remplacer par une règle sur ce texte.
  - name: "1001hobbies — ETB 30 ans"
    url: "https://www.1001hobbies.fr/jeux-de-cartes-a-jouer/892561-pokemon-company-bm-258861-pokemon-30eme-anniversaire-elite-trainer-196214144835.html"
    mode: http

  # Testé : renvoie 403 en HTTP simple, mais passe en mode navigateur.
  # schema.org y expose alors OutOfStock de façon fiable.
  - name: "Carrefour — ETB 30 ans"
    url: "https://www.carrefour.fr/p/cartes-a-jouer-et-a-collectionner-coffret-dresseur-d-elite-30e-anniversaire-pokemon-0196214144835"
    mode: browser
    wait_ms: 5000

  # DÉSACTIVÉ — la Fnac sert un mur anti-bot DataDome (captcha) aussi bien en
  # HTTP qu'en navigateur, y compris depuis une IP résidentielle. Il n'existe pas
  # de moyen propre de la surveiller automatiquement : utilise le bouton
  # "Alerte disponibilité" sur la page produit Fnac, qui fait le même travail.
  - name: "Fnac — ETB 30 ans"
    url: "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Dresseur-d-Elite/a23200296/w-4"
    mode: browser
    enabled: false

# Pour ajouter un revendeur : copie un bloc, change name + url, garde mode: http
# et lance `npm run check:dry -- --verbose` pour voir si la détection tombe juste.
#
# Options utiles sur chaque site :
#   enabled: false                -> met en pause sans supprimer
#   notify_on_out_of_stock: true  -> alerter aussi au retour en rupture
#   notify_on_first_check: false  -> ne pas alerter si déjà dispo au 1er passage
#   scope: "#zone-produit"        -> limiter l'analyse à une zone de la page
#   headers: { Cookie: "..." }    -> en-têtes HTTP supplémentaires
#   in_stock_when: { absent: ["Rupture de stock"] }   -> règle explicite
