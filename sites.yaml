# ---------------------------------------------------------------------------
# Pokémon 30e anniversaire — deux articles surveillés :
#   · Coffret Dresseur d'Élite  (ETB)     EAN 196214144835
#   · Coffret Collection Poster (Poster)  EAN 196214147225
#
# État relevé le 2026-09-18 : tout en rupture chez tous les revendeurs.
# Chaque lien a été testé en conditions réelles, et vérifié comme pointant bien
# sur le bon EAN. URL nettoyées de leurs paramètres de tracking (aecid, ae,
# idOffre), sans effet sur la page servie.
# ---------------------------------------------------------------------------

settings:
  concurrency: 4
  heartbeat_hours: 24     # message "je suis vivant" toutes les 24h (0 = désactivé)
  error_alert_after: 3    # alerte après N échecs consécutifs sur un site
  error_repeat_hours: 12  # puis rappel toutes les N heures tant que ça dure
  timeout_ms: 30000
  retries: 2

sites:
  # Testé OK : schema.org expose OutOfStock, aucune protection anti-bot.
  - name: "King Jouet — ETB 30 ans"
    url: "https://www.king-jouet.com/jeu-jouet/jeux-societes/cartes-a-collectionner/ref-1034916-pokemon-30-ans-coffret-dresseur-d-elite.htm"
    mode: http

  # Testé OK : schema.org expose OutOfStock.
  # Attention, la page affiche "Ajouter au panier" même en rupture : les données
  # structurées font foi, ne pas remplacer par une règle sur ce texte.
  - name: "1001hobbies — ETB 30 ans"
    url: "https://www.1001hobbies.fr/jeux-de-cartes-a-jouer/892561-pokemon-company-bm-258861-pokemon-30eme-anniversaire-elite-trainer-196214144835.html"
    mode: http

  # Testé : renvoie 403 en HTTP simple, mais passe en mode navigateur.
  # schema.org y expose alors OutOfStock de façon fiable.
  # Testé : 403 en HTTP simple, OK en navigateur depuis une IP résidentielle.
  # Depuis les runners GitHub, Cloudflare sert son challenge anti-bot : on lui
  # laisse jusqu'à 30 s pour se résoudre seul avant de déclarer l'échec.
  - name: "Carrefour — ETB 30 ans"
    url: "https://www.carrefour.fr/p/cartes-a-jouer-et-a-collectionner-coffret-dresseur-d-elite-30e-anniversaire-pokemon-0196214144835"
    mode: browser
    wait_ms: 8000
    challenge_timeout_ms: 30000

  # Testé OK : schema.org expose OutOfStock, aucune protection.
  - name: "JouéClub — ETB 30 ans"
    url: "https://www.joueclub.fr/pokemon/pokemon-30eme-anniversaire-coffret-dresseur-d-elite-0196214144835.html"
    mode: http

  # Testé OK : schema.org expose OutOfStock, aucune protection.
  - name: "La Grande Récré — ETB 30 ans"
    url: "https://www.lagranderecre.fr/jeux-de-societe/cartes-a-collectionner/coffret-dresseur-d-elite-pokemon-30e-anniversaire.html"
    mode: http

  # Validé depuis GitHub : fonctionne aussi depuis les IP de datacenter.
  # Testé : en HTTP simple, Cdiscount renvoie une page "activez JavaScript".
  # Pas de captcha, juste un rendu client : le mode navigateur suffit.
  # La page rendue affiche "Actuellement indisponible", cohérent avec schema.org.
  - name: "Cdiscount — ETB 30 ans"
    url: "https://www.cdiscount.com/juniors/jeux-de-societe-cartes/pokemon-etb-coffret-dresseur-d-elite-30e-anniv/f-120791604-pok196214144835.html"
    mode: browser
    wait_ms: 6000

  # DÉSACTIVÉ — la Fnac sert un mur anti-bot DataDome (captcha) aussi bien en
  # HTTP qu'en navigateur, y compris depuis une IP résidentielle. Il n'existe pas
  # de moyen propre de la surveiller automatiquement : utilise le bouton
  # "Alerte disponibilité" sur la page produit Fnac, qui fait le même travail.
  - name: "Fnac — ETB 30 ans"
    url: "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Dresseur-d-Elite/a23200296/w-4"
    mode: browser
    enabled: false

  # -------------------------------------------------------------------------
  # Coffret Collection Poster — EAN 196214147225
  # Les quatre liens testés le 2026-09-18 : bon produit, bon EAN, en rupture.
  # -------------------------------------------------------------------------

  - name: "JouéClub — Coffret Poster"
    url: "https://www.joueclub.fr/pokemon/pokemon-30eme-anniversaire-coffret-collection-poster-0196214147225.html"
    mode: http

  - name: "La Grande Récré — Coffret Poster"
    url: "https://www.lagranderecre.fr/jeux-de-societe/cartes-a-collectionner/coffret-collection-poster-pokemon-30e-anniversaire.html"
    mode: http

  - name: "Cdiscount — Coffret Poster"
    url: "https://www.cdiscount.com/juniors/jeux-de-societe-cartes/pokemon-30-ans-coffret-poster-30eme-anniversaire/f-120791604-pok196214147225.html"
    mode: browser
    wait_ms: 6000

  - name: "Carrefour — Coffret Poster"
    url: "https://www.carrefour.fr/p/coffret-pokemon-collection-poster-30e-anniversaire-pokemon-0196214147225"
