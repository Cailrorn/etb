# Pour ajouter un revendeur : copie un bloc, change name + url, garde mode: http
# et lance `npm run check:dry -- --verbose` pour voir si la détection tombe juste.
#
# Options utiles sur chaque site :
#   enabled: false                -> met en pause sans supprimer
#   notify_on_out_of_stock: true  -> alerter aussi au retour en rupture
#   notify_on_first_check: false  -> ne pas alerter si déjà dispo au 1er passage
#   scope: "#zone-produit"        -> limiter l'analyse à une zone de la page
#   headers: { Cookie: "..." }    -> en-têtes HTTP supplémentaires
#   in_stock_when: { absent: ["Rupture de stock"] }   -> règle explicite

  # ---------------------------------------------------------------------------
  # TÉMOINS DE DÉTECTION
  #
  # Ces entrées ne sont pas des articles à acheter. Ce sont des produits censés
  # rester disponibles en permanence : tant qu'ils remontent 🟢, la détection
  # sait encore dire « disponible » chez ce marchand.
  #
  # Ils couvrent la panne la plus dangereuse du système : une règle ou un
  # balisage qui ne sait plus répondre que « rupture ». Le site répond, la page
  # est lisible, aucun échec n'est signalé — et pourtant aucun réappro ne serait
  # jamais annoncé. Rien d'autre ne détecte ce cas.
  #
  # Chaque témoin utilise LA MÊME méthode de détection que les articles du même
  # marchand : sinon il validerait un chemin de code qui n'est pas celui utilisé.
  #
  # Si un témoin bascule, deux causes possibles : le produit est réellement parti
  # en rupture — il faut le remplacer — ou la détection est cassée.
  # ---------------------------------------------------------------------------

  # Même règle explicite que les 4 articles 1001hobbies.
  - name: "TÉMOIN 1001hobbies"
    url: "https://www.1001hobbies.fr/maquettes-motos/249189-tamiya-tami14131-kawasaki-ninja-h2r-4950344141319.html"
    identity: "4950344141319"
    mode: http
    expect: in_stock
    in_stock_when:
      absent: ["Non disponible actuellement"]

  # Même règle explicite que les 2 articles Philibert.
  - name: "TÉMOIN Philibert"
